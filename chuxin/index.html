<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f4">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>初心学堂 · 安全解锁</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#202838;background:#f7f5f2}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse 90% 55% at 0% 0%,#f4e8e6 0%,transparent 75%),#f8f7f4}
.card{width:min(100%,430px);padding:37px 34px 32px;background:white;border:1px solid #f0e8e3;border-radius:24px;box-shadow:0 28px 70px rgba(44,35,49,.08)}
.logo{width:55px;height:55px;border-radius:16px;background:linear-gradient(135deg,#bb354b,#8f2436);color:white;display:grid;place-items:center;font-size:27px;box-shadow:0 8px 22px #ba354a26;margin-bottom:26px}
h1{font-size:25px;line-height:1.3;margin:0 0 8px;font-weight:830;letter-spacing:.4px}.desc{font-size:13px;line-height:1.9;color:#798291;margin:0 0 26px}
label{display:block;color:#536071;font-weight:750;font-size:12px;margin-bottom:9px}
.inputwrap{position:relative}input{width:100%;border:1px solid #e4e0de;border-radius:12px;background:#fdfcfb;padding:14px 50px 14px 15px;outline:none;font-size:15px;letter-spacing:.5px}input:focus{border-color:#b13b4c;box-shadow:0 0 0 3px #b13b4c18}
.toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#9e5b65;font-size:12px;padding:10px;cursor:pointer}
.submit{margin-top:18px;border:0;border-radius:12px;background:#ae3041;color:white;width:100%;padding:14px;font-weight:800;font-size:14px;min-height:48px;cursor:pointer}.submit:disabled{opacity:.65;cursor:wait}
.error{color:#ba2639;font-size:12px;line-height:1.7;min-height:19px;margin:11px 0 0}
.divider{height:1px;background:#f0ece8;margin:22px 0 17px}.footer{font-size:11px;line-height:1.8;color:#9aa1ab;text-align:center}
.icon{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:5px}
@media(max-width:450px){.card{padding:30px 24px 27px;border-radius:19px}h1{font-size:23px}}
</style>
</head>
<body>
<main class="card">
<div class="logo" aria-hidden="true">★</div>
<h1>初心学堂</h1>
<p class="desc">发展对象结业考试 · 私人学习空间<br>请输入访问密钥以解锁完整题库与学习记录。</p>
<form id="unlock" autocomplete="off">
<label for="secret">访问密钥</label>
<div class="inputwrap">
<input id="secret" type="password" placeholder="请输入访问密钥" required autocomplete="current-password" autocapitalize="off" spellcheck="false">
<button class="toggle" id="toggle" type="button" aria-label="显示或隐藏密码">显示</button>
</div>
<button class="submit" type="submit" id="go">解锁并开始学习</button>
<p class="error" id="error" role="alert" aria-live="polite"></p>
</form>
<div class="divider"></div>
<div class="footer">内容在设备本地解密 · 不上传密码到服务器<br>浏览器不会自动保存本次输入的密钥</div>
</main>

  const data = s => Uint8Array.from(atob(s), x => x.charCodeAt(0));
  const form = document.getElementById('unlock');
  const input = document.getElementById('secret');
  const toggle = document.getElementById('toggle');
  const go = document.getElementById('go');
  const error = document.getElementById('error');
  toggle.addEventListener('click', () => {
    const shown = input.type === 'password';
    input.type = shown ? 'text' : 'password';
    toggle.textContent = shown ? '隐藏' : '显示';
    input.focus();
  });
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = input.value.trim();
    if (!password) return;
    input.value = '';
    go.disabled = true;
    go.textContent = '正在本地解密…';
    error.textContent = '';
    try {
      if (!crypto || !crypto.subtle) throw new Error('unsupported');
      const imported = await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
      const aes = await crypto.subtle.deriveKey({name:'PBKDF2',salt:data(salt),iterations,hash:'SHA-256'},imported,{name:'AES-GCM',length:256},false,['decrypt']);
      const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv:data(nonce),additionalData:new TextEncoder().encode('chuxin-web-v1')},aes,data(ciphertext));
      const page = new TextDecoder('utf-8',{fatal:true}).decode(plain);
      document.open();
      document.write(page);
      document.close();
    } catch (err) {
      error.textContent = err?.message === 'unsupported' ? '浏览器不支持安全解密，请使用最新版 Safari。' : '密钥不正确，请检查后重试。';
      go.disabled = false;
      go.textContent = '解锁并开始学习';
      input.focus();
    }
  });
